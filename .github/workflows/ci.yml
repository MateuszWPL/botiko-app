name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test -- --ci --passWithNoTests

  web:
    name: Web (lint + type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: npx tsc --noEmit

  e2e:
    name: E2E, landing pages (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm e2e --project=chromium
        env:
          CI: true
          # Placeholder env vars, marketing/landing pages don't call Supabase at runtime.
          # Auth-guard tests only check redirect behaviour (no session → /login).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  widget:
    name: Widget (build + size check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/widget

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/widget/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (enforces <14KB gzip)
        run: pnpm build
        env:
          VITE_API_URL: https://api.botiko.pl

      - name: Deploy to Vercel (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_XxFAcXoIM9oL0z3SW1a1QMBj
          VERCEL_PROJECT_ID: prj_mqx686XbMFMs9Rn9zt6qhxlW3ykx

  wp-plugin:
    name: WordPress plugin (PHPCS + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress-plugin/botiko

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer, cs2pr
          coverage: none

      - name: PHP syntax lint
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs --report-full --runtime-set ignore_warnings_on_exit 1

      - name: Build distributable ZIP
        run: bash ../build.sh

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: botiko-wordpress-plugin
          path: wordpress-plugin/dist/botiko.zip
          if-no-files-found: error
